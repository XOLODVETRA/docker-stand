server {
    listen 80;
    server_name _;

    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    location = /adminer {
        absolute_redirect off;
        return 301 /adminer/;
    }

    location /adminer/ {
        client_max_body_size 50m;
        proxy_pass http://adminer:8080/;
        proxy_set_header Host $host;
    }
}
